
name: Event System CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find server -type f -name "*.js" -print0 \
            | xargs -0 -r -n1 node --check

      - name: Validate JSON data files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('server/src/data/events.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('server/src/data/registrations.json', 'utf8'))"

      - name: Run tests
        run: npm test --if-present
